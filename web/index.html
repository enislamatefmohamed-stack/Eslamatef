      display: flex;

      align-items: center;

      z-index: 999999;
      transition: opacity 0.15s ease-out;
      pointer-events: none;
    }
    .instant-line {
      width: 140px;
      height: 3px;
      background: rgba(0, 229, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .instant-line::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, transparent, #00E5FF, transparent);
      animation: fastSweep 0.35s ease-in-out infinite;
    }
    @keyframes fastSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

      margin-top: 14px;
      font-size: 13px;

  <script>
    function removeLoader() {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 150);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    // Safety fallback to ensure instant responsiveness under 250ms
    setTimeout(removeLoader, 250);

    // Allow Ctrl + Mouse Wheel browser zoom and touchpad pinch-to-zoom
    window.addEventListener('wheel', function(e) {
      if (e.ctrlKey) {
        e.stopImmediatePropagation();
      }
    }, { passive: false, capture: true });

    window.addEventListener('touchstart', function(e) {
      if (e.touches && e.touches.length > 1) {
        e.stopImmediatePropagation();
      }
    }, { passive: false, capture: true });
  </script>
