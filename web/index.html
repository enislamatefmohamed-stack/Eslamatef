<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Learn Computer Science, Programming & Artificial Intelligence through practical lessons, problem solving, and real-world projects with Eslam Atef.">
  <meta name="keywords" content="Computer Science, AI Educator, Programming, Artificial Intelligence, Algorithms, Data Structures, Generative AI, Eslam Atef, Code & AI">
  <meta name="author" content="Eslam Atef">

  <!-- Open Graph -->
  <meta property="og:title" content="Eslam Atef | Code & AI — Computer Science & AI Educator">
  <meta property="og:description" content="Think. Code. Build with AI. Practical CS & AI education by Eslam Atef.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eslam Atef | Code & AI">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/assets/images/logo.jpeg"/>

  <title>Eslam Atef | Code & AI — Computer Science & AI Educator</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #070b14;
      margin: 0;
      padding: 0;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: #070b14;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <p style="margin-top: 20px; font-size: 14px; color: #94a3b8; font-weight: 500;">Eslam Atef | Code & AI</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-indicator');
      if (loader) loader.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
