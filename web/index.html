<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Eslam Atef | Code & AI — منصة تعليم علوم الحاسب والبرمجة والذكاء الاصطناعي">
  <meta name="keywords" content="Computer Science, AI Educator, Programming, Artificial Intelligence, Eslam Atef, Code & AI">
  <meta name="author" content="Eslam Atef">

  <!-- Open Graph -->
  <meta property="og:title" content="Eslam Atef | Code & AI — Computer Science & AI Educator">
  <meta property="og:description" content="Think. Code. Build with AI. Practical CS & AI education by Eslam Atef.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eslam Atef | Code & AI">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/assets/images/logo.jpeg"/>

  <title>Eslam Atef | Code & AI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #070b14;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #070b14;
      z-index: 999999;
      transition: opacity 0.15s ease-out;
      pointer-events: none;
    }
    .instant-line {
      width: 140px;
      height: 3px;
      background: rgba(0, 229, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .instant-line::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, transparent, #00E5FF, transparent);
      animation: fastSweep 0.35s ease-in-out infinite;
    }
    @keyframes fastSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .brand-hint {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #00E5FF;
      font-family: -apple-system, sans-serif;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="instant-line"></div>
    <div class="brand-hint">Eslam Atef</div>
  </div>
  <script>
    function removeLoader() {
      const loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 150);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    // Safety fallback to ensure instant responsiveness under 250ms
    setTimeout(removeLoader, 250);

    // Allow Ctrl + Mouse Wheel browser zoom and touchpad pinch-to-zoom
    window.addEventListener('wheel', function(e) {
      if (e.ctrlKey) {
        e.stopImmediatePropagation();
      }
    }, { passive: false, capture: true });

    window.addEventListener('touchstart', function(e) {
      if (e.touches && e.touches.length > 1) {
        e.stopImmediatePropagation();
      }
    }, { passive: false, capture: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
